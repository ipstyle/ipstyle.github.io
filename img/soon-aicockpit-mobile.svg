<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t">
  <title id="t">AI Cockpit Mobile — Home Screen widgets, one line per provider</title>
  <defs>
    <clipPath id="r"><rect width="880" height="440" rx="22"/></clipPath>
    <radialGradient id="g" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#5b8dfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5b8dfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="880" height="440" fill="#14161a"/>
    <rect width="880" height="440" fill="url(#g)"/>

    <text x="62" y="76" font-size="28" font-weight="700" fill="#e9eaee">AI Cockpit</text>
    <rect x="736" y="50" width="82" height="32" rx="16" fill="#20242b"/>
    <text x="777" y="72" font-size="18" font-weight="600" fill="#a0a6b0" text-anchor="middle">iOS</text>

    <!-- home screen widget rows, one line per provider -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="62" y="118" width="756" height="60" rx="16" fill="#1c1f25" stroke="#2a2e36"/>
      <rect x="86" y="140" width="6" height="16" rx="3" fill="#d98757"/>
      <text x="106" y="154" font-size="24" font-weight="600" fill="#e9eaee">Claude</text>
      <text x="794" y="154" font-size="24" font-weight="700" fill="#d98757" text-anchor="end">68%</text>

      <rect x="62" y="188" width="756" height="60" rx="16" fill="#1c1f25" stroke="#2a2e36"/>
      <rect x="86" y="210" width="6" height="16" rx="3" fill="#4ac7a3"/>
      <text x="106" y="224" font-size="24" font-weight="600" fill="#e9eaee">ChatGPT</text>
      <text x="794" y="224" font-size="24" font-weight="700" fill="#4ac7a3" text-anchor="end">41%</text>

      <rect x="62" y="258" width="756" height="60" rx="16" fill="#1c1f25" stroke="#2a2e36"/>
      <rect x="86" y="280" width="6" height="16" rx="3" fill="#8c99f2"/>
      <text x="106" y="294" font-size="24" font-weight="600" fill="#e9eaee">OpenAI · Anthropic</text>
      <text x="794" y="294" font-size="24" font-weight="700" fill="#8c99f2" text-anchor="end">$4.20</text>

      <rect x="62" y="328" width="756" height="60" rx="16" fill="#1c1f25" stroke="#2a2e36"/>
      <rect x="86" y="350" width="6" height="16" rx="3" fill="#ed738c"/>
      <text x="106" y="364" font-size="24" font-weight="600" fill="#e9eaee">Kimi K3</text>
      <text x="794" y="364" font-size="24" font-weight="700" fill="#ed738c" text-anchor="end">55%</text>
    </g>

    <text x="62" y="420" font-size="17" font-weight="600" letter-spacing="1.2" fill="#a0a6b0">HOME SCREEN · LOCK SCREEN · STANDBY</text>
  </g>
</svg>
